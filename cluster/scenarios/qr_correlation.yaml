name: "Quick-Reaction"
description: >
  Correlação entre o tempo de sobrevivência dos fighters azuis (em frames)
  e a longitude do radar vermelho. Demonstra como variar a posição do radar
  vermelho afeta o desempenho dos fighters azuis.

x_variable:
  name: "red_radar_longitude"
  entity_selector:
    side: "red"
    type_contains: "radar"
  field_path: "state.geo_pos.longitude"
  frame_aggregation: "last"
  scope: "per_experiment"

y_variable:
  name: "blue_fighter_survival_time_frames"
  entity_selector:
    side: "blue"
    type_contains: "fighter"
  field_path: "frame"
  frame_aggregation: "max"
  scope: "per_entity"

batch_aggregation:
  type: "pearson_correlation"
